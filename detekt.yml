# detekt configuration for GamePerf Desktop
#
# Thresholds calibrated 2026-04-17 (post-audit adjustments).
# Tighten gradually as code is refactored.

complexity:
  LongMethod:
    threshold: 760       # 2026-05-12: HomeScreen.HomeScreen grew to 751 lines (was 740 on 2026-05-08, 730 on 2026-04-17). TODO H.7: refactor into smaller composables BEFORE next release — threshold creep is technical debt, not solution
  LongParameterList:
    functionThreshold: 50  # ReportGenerator.generate has ~48 params after v4.4.0 additions (events, conclusions, filteredAggregates, etc.)
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 80   # 2026-05-13: AppViewModel has 79 after H.7 Phase 3.1 (runCaptureLoop extracted). Phase 4 will add finalizeSession + setupCaptureState (→81). Threshold IS the post-refactor steady state — the extracts are the refactor goal, not technical debt. 2026-05-08: was 75 (pre-refactor 72 functions). TODO: still consider splitting AppViewModel into focused viewmodels but the H.7 internal decomposition is the right first step.
    thresholdInFiles: 40
    thresholdInObjects: 54   # 2026-05-13: AdbBridge has 53 functions. STAYS at 54 — startcapture-phase-extract tried to revert to 48 (pre-FPower baseline) but blocked: out-of-scope AdbBridge split required to free fns. Pre-FPower baseline 48 only achievable after splitting AdbBridge into domain-specific objects (CRITICAL — 6+ bumps this sprint). v4.5.0 GPU added captureGpuUsage + 5 helpers. 2026-05-12 (PM): was 48. 2026-05-12 AM: was 46 (FPower).
    thresholdInInterfaces: 33  # 2026-05-13: AdbBridgeApi has 32 functions. STAYS at 33 — startcapture-phase-extract tried to revert to 30 (pre-FPower baseline) but blocked: AdbBridgeApi mirrors AdbBridge size, same out-of-scope split required. v4.5.0 GPU added captureGpuUsage. 2026-05-12 (PM): was 32. 2026-05-12 AM: was 30 (FPower).
  CyclomaticComplexMethod:
    threshold: 200       # 2026-05-13: reverted to 200 after startcapture-phase-extract landed (H.7 DONE in startcapture-phase-extract change archived 2026-05-13 — startCapture decomposed into 6 phase methods: setupCaptureState/bootstrapScreenRecording/launchEventDetector/launchChainedRecording/launchUiTimer/runCaptureLoop, accumulators hoisted to CaptureAccumulators holder). Pre-refactor history: hit 226 (v4.5.0 GPU), 216 (cpu-dual), 215 (FPower), 200 (v4.4.0 baseline). Both startCapture AND runCaptureLoop CCN ≤ 200 post-extract.
  LargeClass:
    threshold: 2000
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  ReturnCount:
    max: 9
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false        # ProcessBuilder + File I/O use catch(Exception) as never-throws contracts

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
  PackageNaming:
    active: true

potential-bugs:
  UnsafeCast:
    active: true
  LateinitUsage:
    active: false

performance:
  SpreadOperator:
    active: false
