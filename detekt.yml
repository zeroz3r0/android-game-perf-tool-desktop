# detekt configuration for GamePerf Desktop
#
# Thresholds calibrated 2026-04-17 (post-audit adjustments).
# Tighten gradually as code is refactored.

complexity:
  LongMethod:
    threshold: 700       # 2026-04-17: HomeScreen.HomeScreen is 687 lines. TODO: refactor into smaller composables
  LongParameterList:
    functionThreshold: 42  # ReportGenerator.generate has 41 params
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 70   # AppViewModel has 67 functions
    thresholdInFiles: 40
    thresholdInObjects: 46   # 2026-05-08: AdbBridge has 45 functions (v4.4.0 added startLogcat for auto event detection). TODO: split into domain-specific objects
    thresholdInInterfaces: 30  # 2026-05-08: AdbBridgeApi has 29 functions (v4.4.0 added startLogcat + shell). TODO: split into focused interfaces
  CyclomaticComplexMethod:
    threshold: 175       # 2026-04-17: startCapture is 170. TODO: refactor into smaller functions
  LargeClass:
    threshold: 2000
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  ReturnCount:
    max: 9
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false        # ProcessBuilder + File I/O use catch(Exception) as never-throws contracts

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
  PackageNaming:
    active: true

potential-bugs:
  UnsafeCast:
    active: true
  LateinitUsage:
    active: false

performance:
  SpreadOperator:
    active: false
