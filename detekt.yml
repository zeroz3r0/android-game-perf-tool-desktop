# detekt configuration for GamePerf Desktop
#
# Thresholds calibrated 2026-04-17 (post-audit adjustments).
# Tighten gradually as code is refactored.

complexity:
  LongMethod:
    threshold: 760       # 2026-05-12: HomeScreen.HomeScreen grew to 751 lines (was 740 on 2026-05-08, 730 on 2026-04-17). TODO H.7: refactor into smaller composables BEFORE next release — threshold creep is technical debt, not solution
  LongParameterList:
    functionThreshold: 50  # ReportGenerator.generate has ~48 params after v4.4.0 additions (events, conclusions, filteredAggregates, etc.)
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 75   # 2026-05-08: AppViewModel has 72 functions (v4.4.0 added events/warnings flows + detector wiring). TODO: split AppViewModel into focused viewmodels
    thresholdInFiles: 40
    thresholdInObjects: 54   # 2026-05-13: AdbBridge has 53 functions (v4.5.0 gpu-usage-percent added captureGpuUsage + 5 private helpers: captureGpuUsageImpl, readGpuFromProbeHit, readGpuFromCachedState, adrenoProbeFailedTryEnable, buildProbeOneShellCommand). 2026-05-12 (PM): was 48 (cpu-total-vs-app-usage captureCpuDual). 2026-05-12 AM: was 46 (FPower). TODO: split AdbBridge into domain-specific objects (CRITICAL — 6+ bumps this sprint).
    thresholdInInterfaces: 33  # 2026-05-13: AdbBridgeApi has 32 functions (v4.5.0 gpu-usage-percent added captureGpuUsage). 2026-05-12 (PM): was 32 (cpu-total-vs-app-usage captureCpuDual). 2026-05-12 AM: was 30 (FPower). TODO: split into focused interfaces.
  CyclomaticComplexMethod:
    threshold: 230       # 2026-05-13: startCapture hit 226 (v4.5.0 gpu-usage-percent Sprint 1 — captureGpuUsage poll + history append gate + LiveMetrics emit + ReportGenerator wiring + SessionResult/HistoryEntry threading). 2026-05-12 (PM late): was 216 (cpu-total-vs-app-usage + DevActionBrief). 2026-05-12 (PM mid): was 215 (FPower wiring). 2026-05-08: was 200 (v4.4.0 EventDetector + FilteredMetricsCalculator). TODO H.7 — URGENT: extract capture-phase sub-functions BEFORE next release. 6+ threshold bumps now — structural refactor overdue.
  LargeClass:
    threshold: 2000
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  ReturnCount:
    max: 9
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false        # ProcessBuilder + File I/O use catch(Exception) as never-throws contracts

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
  PackageNaming:
    active: true

potential-bugs:
  UnsafeCast:
    active: true
  LateinitUsage:
    active: false

performance:
  SpreadOperator:
    active: false
