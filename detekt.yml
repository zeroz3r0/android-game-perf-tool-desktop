# detekt configuration for GamePerf Desktop
#
# Thresholds calibrated 2026-04-17 (post-audit adjustments).
# Tighten gradually as code is refactored.

complexity:
  LongMethod:
    threshold: 760       # 2026-05-12: HomeScreen.HomeScreen grew to 751 lines (was 740 on 2026-05-08, 730 on 2026-04-17). TODO H.7: refactor into smaller composables BEFORE next release — threshold creep is technical debt, not solution
  LongParameterList:
    functionThreshold: 50  # ReportGenerator.generate has ~48 params after v4.4.0 additions (events, conclusions, filteredAggregates, etc.)
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 81   # 2026-05-13: bumped 80→81 for v4.6.x network-bandwidth-total-app Phase 5 (resolveNetworkUid helper extracted from runCaptureLoop wire — keeps CCN flat per D7). Pre-v4.6.x baseline 80 (post-H.7 Phase 3.1 runCaptureLoop extract). TODO: still consider splitting AppViewModel into focused viewmodels but the H.7 internal decomposition is the right first step.
    thresholdInFiles: 40
    thresholdInObjects: 63   # 2026-05-13: bumped 62→63 for v4.6.x network-bandwidth-total-app Phase 5 (getUidForPackage helper for UID lookup before network probe). Pre-v4.6.x Phase 4: 62 (53 → 62 with captureNetworkBandwidth + 7 private helpers). STAYS at 63 — same CRITICAL "split AdbBridge into domain-specific objects" backlog item applies. Pre-v4.5.0: 54.
    thresholdInInterfaces: 35  # 2026-05-13: bumped 34→35 for v4.6.x network-bandwidth-total-app Phase 5 (getUidForPackage). Pre-v4.6.x Phase 4: 34 (33→34 with captureNetworkBandwidth). STAYS at 35 — mirrors AdbBridge size, same out-of-scope split required. Pre-v4.5.0: 33.
  CyclomaticComplexMethod:
    threshold: 200       # 2026-05-13: reverted to 200 after startcapture-phase-extract landed (H.7 DONE in startcapture-phase-extract change archived 2026-05-13 — startCapture decomposed into 6 phase methods: setupCaptureState/bootstrapScreenRecording/launchEventDetector/launchChainedRecording/launchUiTimer/runCaptureLoop, accumulators hoisted to CaptureAccumulators holder). Pre-refactor history: hit 226 (v4.5.0 GPU), 216 (cpu-dual), 215 (FPower), 200 (v4.4.0 baseline). Both startCapture AND runCaptureLoop CCN ≤ 200 post-extract.
  LargeClass:
    # ReportGenerator hit 2408 (was 2000) with v4.5.0 GPU/FPower/KPI sections + KPI HTML report sections.
    # 2500 documented bump; TODO consider splitting ReportGenerator into per-section helpers per the
    # core/report/kpi/ precedent. Tracked alongside H.8 (adbbridge-split) backlog.
    threshold: 2500
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  ReturnCount:
    max: 9
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false        # ProcessBuilder + File I/O use catch(Exception) as never-throws contracts

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
  PackageNaming:
    active: true

potential-bugs:
  UnsafeCast:
    active: true
  LateinitUsage:
    active: false

performance:
  SpreadOperator:
    active: false
