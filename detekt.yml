# detekt configuration for GamePerf Desktop
#
# Thresholds calibrated 2026-04-17 (post-audit adjustments).
# Tighten gradually as code is refactored.

complexity:
  LongMethod:
    threshold: 760       # 2026-05-12: HomeScreen.HomeScreen grew to 751 lines (was 740 on 2026-05-08, 730 on 2026-04-17). TODO H.7: refactor into smaller composables BEFORE next release — threshold creep is technical debt, not solution
  LongParameterList:
    functionThreshold: 50  # ReportGenerator.generate has ~48 params after v4.4.0 additions (events, conclusions, filteredAggregates, etc.)
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 75   # 2026-05-08: AppViewModel has 72 functions (v4.4.0 added events/warnings flows + detector wiring). TODO: split AppViewModel into focused viewmodels
    thresholdInFiles: 40
    thresholdInObjects: 47   # 2026-05-12: AdbBridge has 46 functions (v4.5.0 added captureFPower for FPower metric). 2026-05-08: was 45 (v4.4.0 added startLogcat). TODO: split into domain-specific objects
    thresholdInInterfaces: 31  # 2026-05-12: AdbBridgeApi has 30 functions (v4.5.0 added captureFPower). 2026-05-08: was 29 (v4.4.0 added startLogcat + shell). TODO: split into focused interfaces
  CyclomaticComplexMethod:
    threshold: 215       # 2026-05-12 (PM): startCapture grew to 211 (v4.5.0 added FPower wiring 4 sites + ReportGenerator.generate fpower args call site). 2026-05-08: was 200 (v4.4.0 EventDetector + FilteredMetricsCalculator). TODO H.7: extract capture-phase sub-functions BEFORE next release — threshold creep is acknowledged tech debt + bridge until refactor
  LargeClass:
    threshold: 2000
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  ReturnCount:
    max: 9
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false        # ProcessBuilder + File I/O use catch(Exception) as never-throws contracts

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
  PackageNaming:
    active: true

potential-bugs:
  UnsafeCast:
    active: true
  LateinitUsage:
    active: false

performance:
  SpreadOperator:
    active: false
