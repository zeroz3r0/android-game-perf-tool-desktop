# detekt configuration for GamePerf Desktop
#
# Thresholds calibrated 2026-04-15 (probed actual maxes).
# Tighten gradually as code is refactored.

complexity:
  LongMethod:
    threshold: 600       # Actual max: ReportGenerator.generate 591 (HomeScreen dropped to ~480)
  LongParameterList:
    functionThreshold: 42  # ReportGenerator.generate has 41 params
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 70   # AppViewModel has 67 functions
    thresholdInFiles: 40
    thresholdInObjects: 40   # AdbBridge singleton has 38 functions
    thresholdInInterfaces: 26  # Actual max: 25 — tightened from 27
  CyclomaticComplexMethod:
    threshold: 165       # AppViewModel.startCapture is 162 — no room yet
  LargeClass:
    threshold: 2000
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  ReturnCount:
    max: 9
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false        # ProcessBuilder + File I/O use catch(Exception) as never-throws contracts

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
  PackageNaming:
    active: true

potential-bugs:
  UnsafeCast:
    active: true
  LateinitUsage:
    active: false

performance:
  SpreadOperator:
    active: false
