# detekt configuration for GamePerf Desktop
#
# Thresholds calibrated to the current codebase (v4.1.0 baseline).
# Tighten gradually as code is refactored.

complexity:
  LongMethod:
    threshold: 730       # HomeScreen is 728 LOC (single Composable — split in future)
  LongParameterList:
    functionThreshold: 42  # ReportGenerator.generate has 40+ metrics params
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 65   # AppViewModel has ~60 public functions
    thresholdInFiles: 40
    thresholdInObjects: 40   # AdbBridge singleton has 38 functions
    thresholdInInterfaces: 27  # AdbBridgeApi/DeviceBridgeApi have 16-25
  CyclomaticComplexMethod:
    threshold: 165       # AppViewModel.startCapture is the worst (162)
  LargeClass:
    threshold: 2000
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  ReturnCount:
    max: 9
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false        # ProcessBuilder + File I/O use catch(Exception) as never-throws contracts

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
  VariableNaming:
    active: true
  PackageNaming:
    active: true

potential-bugs:
  UnsafeCast:
    active: true
  LateinitUsage:
    active: false

performance:
  SpreadOperator:
    active: false
