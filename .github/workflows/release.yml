name: Release

on:
  push:
    tags: ['v*']

# v4.1.0: Node.js 20 hard-deprecated 2026-09-16. All actions already pinned to v4.
# No action here uses Node.js directly, but runner environments will eventually
# drop Node.js 20 — this comment tracks the awareness.

jobs:
  # ===== Build PyInstaller sidecar binary (macOS + Windows only — iOS connectivity) =====
  sidecar:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies + PyInstaller
        shell: bash
        working-directory: sidecar
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements-lock.txt

      - name: Build sidecar binary
        shell: bash
        working-directory: sidecar
        run: pyinstaller gameperf_sidecar.spec --distpath dist --workpath build/pyinstaller --clean

      - name: Rename binary with platform suffix
        shell: bash
        working-directory: sidecar/dist
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv gameperf-sidecar.exe gameperf-sidecar-windows.exe
          else
            mv gameperf-sidecar gameperf-sidecar-macos
          fi

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}
          path: |
            sidecar/dist/gameperf-sidecar-windows.exe
            sidecar/dist/gameperf-sidecar-macos

  # ===== Smoke test: compile + test on ubuntu before burning CI time on 3 platforms =====
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run tests
        run: ./gradlew test --console=plain
      - name: Verify compilation
        run: ./gradlew classes --console=plain

  build:
    needs: smoke
    strategy:
      matrix:
        # macos-13 (Intel x64) is deprecated in GitHub Actions and gets cancelled at runtime.
        # We build macos-x64 manually post-release via `gh release upload` from a local x64
        # build. See docs/IntegrationManualTest.md for the procedure.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build fat JAR
        run: ./gradlew packageUberJarForCurrentOS

      - name: Verify JAR exists and is non-trivial
        shell: bash
        run: |
          JAR=$(find build/compose/jars -name "*.jar" | head -1)
          if [ -z "$JAR" ]; then echo "FATAL: no JAR produced"; exit 1; fi
          SIZE=$(stat -f%z "$JAR" 2>/dev/null || stat -c%s "$JAR" 2>/dev/null)
          echo "JAR: $JAR ($SIZE bytes)"
          if [ "$SIZE" -lt 50000000 ]; then echo "WARNING: JAR suspiciously small ($SIZE bytes)"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-perf-desktop-${{ matrix.os }}
          path: build/compose/jars/*.jar

  release:
    needs: [build, sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v4.2.11: hide the release behind draft=true while we upload assets.
      # Draft releases are NOT returned by GitHub's public /releases API, so the
      # AutoUpdater running in users' installations won't see this release
      # until the binaries are uploaded. This closes the recurring "No hay JAR
      # disponible para tu plataforma" bug that happened in v4.2.3, v4.2.4,
      # v4.2.9, and v4.2.10: the 6-7 minute window between `gh release create`
      # and the end of this workflow.
      #
      # The release is created by the human running `gh release create` just
      # before pushing the tag. That command creates it published-but-empty,
      # which is why the banner would show up with nothing to download. Now we
      # flip it to draft as soon as this job starts, so it becomes invisible,
      # and flip it back to published ONLY after all assets are uploaded.
      #
      # Failure mode: if the workflow fails mid-way, the release stays draft
      # forever. That's an acceptable trade-off (nobody sees a broken release)
      # vs the pre-v4.2.11 behavior (everybody sees a release with no JAR).
      # To recover: either delete the release (`gh release delete vX.Y.Z`)
      # or manually publish it after fixing the build.
      #
      # See CLAUDE.md "Patrón de bug recurrente" for the full lesson.
      - name: Mark release as draft while we upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft --repo "${{ github.repository }}"

      - uses: actions/download-artifact@v4

      - name: Upload assets + publish release
        uses: softprops/action-gh-release@v2
        with:
          # draft: false flips the release back to published AFTER files are uploaded,
          # so the AutoUpdater only sees it once the binaries are available. The
          # order inside softprops/action-gh-release is: download assets, upload
          # them to the existing release, then update release metadata (draft,
          # body, etc.). So by the time draft=false takes effect, all files
          # are already present.
          draft: false
          files: |
            game-perf-desktop-*/*.jar
            sidecar-*/gameperf-sidecar-*
          # generate_release_notes left at default (false) to preserve the manual
          # notes passed to `gh release create --notes-file`. Auto-generated notes
          # would clobber the curated Spanish changelog we write per release.
