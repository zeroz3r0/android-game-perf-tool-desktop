name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        # macos-latest = arm64 (Apple Silicon), macos-13 = x64 (Intel).
        # Both are needed because Apple Silicon Macs running the JVM under Rosetta
        # report os.arch=x86_64, so they download the macos-x64 JAR. Without it,
        # the auto-updater falls back to the wrong asset and the update never lands.
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build fat JAR
        run: ./gradlew packageUberJarForCurrentOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-perf-desktop-${{ matrix.os }}
          path: build/compose/jars/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            game-perf-desktop-*/*.jar
          generate_release_notes: true
