name: Release

on:
  push:
    tags: ['v*']

# v4.1.0: Node.js 20 hard-deprecated 2026-09-16. All actions already pinned to v4.
# No action here uses Node.js directly, but runner environments will eventually
# drop Node.js 20 — this comment tracks the awareness.

jobs:
  # ===== v4.2.11 fix iteration 2: hide release BEFORE the build jobs start =====
  #
  # The first attempt (commit 9ee4eac) only flipped the release to draft in the
  # final `release` job that needs [build, sidecar]. Those jobs take 5-6 min;
  # during that window the release stayed published-with-no-assets, which is
  # exactly the bug we're trying to fix.
  #
  # Second attempt (this job): run gh release edit --draft IMMEDIATELY when
  # the workflow starts — before any other job. The other jobs depend on this
  # one via `needs: mark-draft` so they don't start until the release is
  # already hidden. The mark-draft job itself takes ~5 seconds.
  #
  # Why not just create the release as --draft in the manual `gh release
  # create`? Because that's a human step and humans forget. This guarantees
  # the behavior regardless of what the human did.
  mark-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hide release behind draft=true while we build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Flipping release ${{ github.ref_name }} to draft so the AutoUpdater ignores it while we build…"
          gh release edit "${{ github.ref_name }}" --draft --repo "${{ github.repository }}" || {
            echo "Note: release might not exist yet (tag pushed without gh release create). Creating minimal draft."
            gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes "Building…" --repo "${{ github.repository }}"
          }

  # ===== Build PyInstaller sidecar binary (macOS + Windows only — iOS connectivity) =====
  sidecar:
    needs: mark-draft
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies + PyInstaller
        shell: bash
        working-directory: sidecar
        run: |
          # v4.4.1: pip 26+ refuses self-upgrade via `pip install --upgrade pip`,
          # mandating `python -m pip` instead. Switched all pip invocations to
          # the python -m form for consistency across pip versions.
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-lock.txt

      - name: Build sidecar binary
        shell: bash
        working-directory: sidecar
        run: pyinstaller gameperf_sidecar.spec --distpath dist --workpath build/pyinstaller --clean

      - name: Rename binary with platform suffix
        shell: bash
        working-directory: sidecar/dist
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv gameperf-sidecar.exe gameperf-sidecar-windows.exe
          else
            mv gameperf-sidecar gameperf-sidecar-macos
          fi

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}
          path: |
            sidecar/dist/gameperf-sidecar-windows.exe
            sidecar/dist/gameperf-sidecar-macos

  # ===== Smoke test: compile + test on ubuntu before burning CI time on 3 platforms =====
  smoke:
    needs: mark-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run tests
        run: ./gradlew test --console=plain
      - name: Verify compilation
        run: ./gradlew classes --console=plain

  build:
    needs: smoke
    strategy:
      matrix:
        # macos-13 (Intel x64) is deprecated in GitHub Actions and gets cancelled at runtime.
        # We build macos-x64 manually post-release via `gh release upload` from a local x64
        # build. See docs/IntegrationManualTest.md for the procedure.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build fat JAR
        run: ./gradlew packageUberJarForCurrentOS

      - name: Verify JAR exists and is non-trivial
        shell: bash
        run: |
          JAR=$(find build/compose/jars -name "*.jar" | head -1)
          if [ -z "$JAR" ]; then echo "FATAL: no JAR produced"; exit 1; fi
          SIZE=$(stat -f%z "$JAR" 2>/dev/null || stat -c%s "$JAR" 2>/dev/null)
          echo "JAR: $JAR ($SIZE bytes)"
          if [ "$SIZE" -lt 50000000 ]; then echo "WARNING: JAR suspiciously small ($SIZE bytes)"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-perf-desktop-${{ matrix.os }}
          path: build/compose/jars/*.jar

  # ===== v4.4.1: Windows MSI installer =====
  #
  # Compose Desktop's `packageReleaseMsi` (jpackage under the hood) produces an
  # `.msi` that elevates via UAC, installs into `C:\Program Files\GamePerf\`,
  # and registers a Start Menu / Add-Remove Programs entry. The generated MSI is
  # what the v4.4.1 fallback panel's "Descargar manualmente" button points users
  # to when their in-app updater fails (UAC denied, watchdog timeout, etc.).
  #
  # Restored after v4.x silently dropped MSI when the original release.yml was
  # rewritten — only `packageUberJarForCurrentOS` was running and the bundled
  # JAR alone is not installable for non-technical Windows users. See spec
  # capability `release-packaging` REQ "Windows release publishes MSI installer".
  msi:
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # WiX 3.x is required by jpackage to produce MSI. As of late-2025 the
      # `windows-latest` runner image still ships WiX 3.14, but Microsoft has
      # rotated the image multiple times this year — guard with a probe so a
      # future image without WiX still produces an MSI instead of failing the
      # whole release.
      - name: Probe for WiX (light.exe / candle.exe)
        id: wix-probe
        shell: pwsh
        run: |
          $found = $false
          foreach ($exe in @('candle.exe', 'light.exe')) {
            $cmd = Get-Command $exe -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "Found $exe at $($cmd.Source)"
              $found = $true
            }
          }
          if ($found) {
            Write-Host "wix=present" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "wix=missing" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Install WiX 3.14 (only when missing)
        if: steps.wix-probe.outputs.wix == 'missing'
        shell: pwsh
        run: |
          Write-Host "WiX not found — installing via Chocolatey…"
          choco install wixtoolset -y --no-progress

      - name: Build MSI installer
        run: ./gradlew packageReleaseMsi --console=plain

      - name: Locate MSI artifact
        id: locate-msi
        shell: bash
        run: |
          MSI=$(find build/compose/binaries/main-release/msi -name "*.msi" | head -1)
          if [ -z "$MSI" ]; then
            # jpackage writes to either main-release/ or main/; fall back.
            MSI=$(find build/compose/binaries/main/msi -name "*.msi" 2>/dev/null | head -1)
          fi
          if [ -z "$MSI" ]; then
            echo "FATAL: no MSI produced under build/compose/binaries/"
            find build/compose/binaries -type f -name "*.msi" || true
            exit 1
          fi
          echo "MSI: $MSI ($(stat -c%s "$MSI" 2>/dev/null || stat -f%z "$MSI") bytes)"
          # Stage in a stable subdir so upload-artifact globs predictably.
          mkdir -p msi-out
          cp "$MSI" msi-out/

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-perf-desktop-msi
          path: msi-out/*.msi

  # v4.2.11 fix iteration 2: the `mark-draft` job at the top of this workflow
  # has already flipped the release to draft before any build job started, so
  # this job only needs to upload the assets and flip draft=false to make the
  # release visible again. The AutoUpdater in any client version only sees the
  # release after this job finishes — which is precisely when the binaries are
  # available for download.
  release:
    needs: [build, sidecar, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Upload assets + publish release
        uses: softprops/action-gh-release@v2
        with:
          # draft: false flips the release from draft back to published AFTER all
          # files have been uploaded. softprops internally does: download assets
          # from artifact store → upload to the release → update release metadata.
          # So when draft=false takes effect, the binaries are already attached.
          draft: false
          files: |
            game-perf-desktop-*/*.jar
            game-perf-desktop-msi/*.msi
            sidecar-*/gameperf-sidecar-*
          # generate_release_notes left at default (false) to preserve the manual
          # notes passed to `gh release create --notes-file` by the human before
          # pushing the tag. Auto-generated notes would clobber the curated
          # Castilian Spanish changelog we write per release.
