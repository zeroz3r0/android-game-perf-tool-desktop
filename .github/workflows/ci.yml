name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']   # release.yml handles tag pushes
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run detekt
        run: ./gradlew detekt --console=plain

      - name: Run tests
        run: ./gradlew test --console=plain

      - name: Verify compilation
        run: ./gradlew classes --console=plain

  pytest-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('sidecar/requirements-lock.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -e sidecar/[dev]

      - name: Run sidecar tests
        run: pytest sidecar/tests/ -v
